on:
  workflow_call:
    inputs:
      release-type:
        type: string
        required: true
        description: release type
        default: "node"
      token:
        type: string
        required: false
        description: GitHub token for release-please
        default: ${{ github.token }}

name: Release

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: ${{ inputs.release-type }}
          token: ${{ inputs.token }}
